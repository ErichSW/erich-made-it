<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>New Blog Post</title>
    /styles.css
</head>

<body>
    <main class="publisher">
        <header>
            <p class="eyebrow">Local publisher</p>
            <h1>Create a new post</h1>
            <p>
                This creates a Markdown file, commits it, and pushes it
                to GitHub.
            </p>
        </header>

        <form id="post-form">
            <div class="field">
                <label for="title">Title</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    maxlength="200"
                    required
                    autofocus
                >
            </div>

            <div class="field">
                <label for="content">Content</label>
                <textarea
                    id="content"
                    name="content"
                    rows="18"
                    required
                ></textarea>
                <small>Markdown formatting is supported.</small>
            </div>

            <div class="field">
                <label for="timestamp">Timestamp</label>
                <input
                    type="text"
                    id="timestamp"
                    name="timestamp"
                    readonly
                >
                <small>
                    The server generates the final timestamp when publishing.
                </small>
            </div>

            <button type="submit" id="publish-button">
                Publish post
            </button>
        </form>

        <div
            id="status"
            class="status"
            role="status"
            aria-live="polite"
        ></div>
    </main>

    /app.jsscript>
</body>
</html>
