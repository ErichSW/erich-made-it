<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Erich Said It</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="icon" href="../assets/letter-e.png" type="image/x-icon">
        <script src="scripts.js" defer></script>
    </head>
    <body>
        <main>
            <form id="post-form">
                <div id="mockup">
                    <input placeholder="Give it a catchy title..." type="text" id="title"><br>
                    <textarea placeholder="Say something nice..." id="content" rows="15" required></textarea><br>
                    <p id="timestamp">Timestamp here</p>
                </div>

                <div id="submit-button">
                    <button type="submit" id="publish">Put it on the internet</button>
                </div>
            </form>
        </main>
        <footer>
        </footer>
    </body>
</html>
